# Publishes a GitHub Release when a version tag (v1.2.3) is pushed, when the
# `release` branch is pushed (version from the VERSION file — used by sessions
# that may push branches but not tags), or on demand. Builds everything through ci.yml (workflow_call), then attaches:
#   Heartfulness-Remote-Mac.zip                    host app (+ README-FIRST.txt)
#   Heartfulness-Remote-Client-Mac.dmg             client for Mac
#   Heartfulness-Remote-Client-Windows.msi         client for Windows (MSI)
#   Heartfulness-Remote-Client-Windows-Setup.exe   client for Windows (installer)
#   SHA256SUMS.txt
# Notes come from .github/release-notes.md. Results are also written to
# ci-results/release-<job> branches (see ci.yml).
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, e.g. v0.1.0 (created on the selected commit if it does not exist yet)
        required: true
        type: string
      draft:
        description: Create the release as a draft
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false
      - name: Validate tag
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="v$(tr -d '[:space:]' < VERSION)"
          else
            tag="$INPUT_TAG"
          fi
          # x.y.z only: the MSI ProductVersion allows major/minor <= 255, patch <= 65535.
          if ! [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] \
             || [ "${BASH_REMATCH[1]}" -gt 255 ] || [ "${BASH_REMATCH[2]}" -gt 255 ] || [ "${BASH_REMATCH[3]}" -gt 65535 ]; then
            echo "::error::release tags must look like v1.2.3 (got '$tag')"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  build:
    name: build
    needs: [version]
    uses: ./.github/workflows/ci.yml
    # ci.yml keeps every build job read-only; only its report jobs use write.
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}
      report-prefix: release-

  publish:
    name: publish
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: heartfulness-remote-*
          path: assets
          merge-multiple: true
      - name: Verify assets and write SHA256SUMS.txt
        run: bash .github/scripts/release-assets.sh assets 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          {
            cd assets
            files=(Heartfulness-Remote-Mac.zip Heartfulness-Remote-Client-Mac.dmg
                   Heartfulness-Remote-Client-Windows.msi Heartfulness-Remote-Client-Windows-Setup.exe
                   SHA256SUMS.txt)
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG already exists: replacing its assets"
              gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            else
              args=(--title "Heartfulness Remote $VERSION" --notes-file ../.github/release-notes.md)
              if [ "$GITHUB_REF_TYPE" = tag ]; then
                args+=(--verify-tag)
              else
                args+=(--target "$GITHUB_SHA")
              fi
              if [ "${DRAFT:-false}" = true ]; then args+=(--draft); fi
              gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${args[@]}" "${files[@]}"
            fi
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | "  \(.name)  \(.size) bytes")'
          } 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Collect CI log
        if: always()
        uses: ./.github/actions/ci-log
        with:
          name: publish
          status: ${{ job.status }}

  report:
    name: report (publish)
    needs: [version, build, publish]
    if: >-
      always() &&
      github.repository == 'videoproduction-ctrl/heartfulness-remote' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: ci-log-publish
          path: ci-logs/ci-log-publish
      - name: Publish ci-results/release-publish
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: release-
          NEEDS_JSON: ${{ toJSON(needs) }}
          PUBLISH: publish=publish
        run: bash .github/scripts/ci-report-push.sh ci-logs
